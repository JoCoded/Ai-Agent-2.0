name: Quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q creative_agent tests evaluation
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example output
        run: python -m creative_agent examples/sample_brief.json > /tmp/creative-plan.json
      - name: Run offline evaluation suite
        run: python -m evaluation.offline_eval
